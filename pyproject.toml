[project]
name = "ai-wrapped"
version = "0.1.0"
description = "Your year with Claude, computed locally with DuckDB."
requires-python = ">=3.10"
dependencies = ["duckdb==1.5.4"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["scripts/wrapped.py", "scripts/make_fixtures.py", "tests"]
exclude = ["scripts/legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/legacy/*"]
