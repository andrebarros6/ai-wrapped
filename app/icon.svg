  <!-- the card behind (the "next" story) -->
  <rect x="10" y="4" width="17" height="24" rx="3" fill="#c4593a"/>
  <!-- the card in front -->
  <rect x="5" y="6" width="17" height="22" rx="3" fill="#e8dcc8"/>
